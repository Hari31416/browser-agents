<!doctype html><title>Boundary probe</title><pre id="output">running</pre><script>
const frame = document.createElement('iframe');
frame.sandbox='allow-scripts';
frame.srcdoc = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'"><script>
const source = \`onmessage=async()=>{const out={}; try{indexedDB.open('probe');out.indexedDB='allowed'}catch(e){out.indexedDB=e.name} try{await caches.open('probe');out.cache='allowed'}catch(e){out.cache=e.name} out.parent=typeof parent; for(const url of ['http://127.0.0.1:5173/','https://example.com/']){try{await fetch(url,{mode:'no-cors'});out[url]='allowed'}catch(e){out[url]=e.name}} try{const ws=new WebSocket('ws://127.0.0.1:5173/');out.websocket=await new Promise(r=>{ws.onerror=()=>r('error');ws.onopen=()=>{ws.close();r('allowed')};setTimeout(()=>r('timeout'),1000)})}catch(e){out.websocket=e.name} postMessage(out)}\`;
const worker=new Worker(URL.createObjectURL(new Blob([source],{type:'text/javascript'})));worker.onmessage=e=>parent.postMessage(e.data,'*');worker.postMessage(0);
<\/script>`;
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;window.phase0Result=event.data;document.querySelector('#output').textContent=JSON.stringify(event.data)});
document.body.append(frame);
</script>
